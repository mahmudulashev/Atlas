# Builds and checks atlas-engine on every platform it is meant to run on.
#
# The macOS app is built by release.yml; this workflow is about the half that
# is supposed to be portable. Windows is the one that matters — the Windows
# client depends on this binary existing — but Linux is built too, because it
# is free and it catches anything Apple's Foundation is quietly forgiving of.
name: Engine

on:
  push:
    branches: [main]
    paths:
      - 'Sources/AtlasEngine/**'
      - 'Sources/AtlasCLI/**'
      - 'Tests/Fixtures/**'
      - 'Scripts/verify-engine.py'
      - 'Package.swift'
      - '.github/workflows/engine.yml'
  pull_request:
    paths:
      - 'Sources/AtlasEngine/**'
      - 'Sources/AtlasCLI/**'
      - 'Tests/Fixtures/**'
      - 'Scripts/verify-engine.py'
      - 'Package.swift'
      - '.github/workflows/engine.yml'
  workflow_dispatch:

# Kept in one place, and deliberately the same version the macOS app is built
# with. Swift 6.0.3 could not build here at all: its module maps disagree with
# the Windows SDK on the runner and `ucrt` ends up importing itself.
env:
  SWIFT_VERSION: '6.3.3'

jobs:
  engine:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            binary: .build/release/atlas-engine.exe
          - name: macOS
            os: macos-15
            binary: .build/release/atlas-engine
          - name: Linux
            os: ubuntu-latest
            binary: .build/release/atlas-engine

    steps:
      - uses: actions/checkout@v4

      # Package.swift is swift-tools-version 6.0 and the target asks for the
      # Swift 6 language mode, so every platform needs a 6.x toolchain. The
      # macOS runner's default Xcode is new enough; the others are not.
      - name: Install Swift
        uses: SwiftyLab/setup-swift@latest
        with:
          swift-version: ${{ env.SWIFT_VERSION }}

      # Guarantees `python` exists under that name on all three runners.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Report toolchain
        shell: bash
        run: swift --version

      - name: Build
        shell: bash
        run: swift build -c release

      - name: Verify
        shell: bash
        run: python Scripts/verify-engine.py ${{ matrix.binary }}

      # Proves the platforms agree, not merely that each one is self-consistent.
      # A parser that reads a file differently on Windows would pass every
      # check above and still make the two clients disagree.
      # Both the fixture and this repository. The fixture alone was too small
      # to notice a walk that lost whole directories -- six files have no
      # subdirectories to lose.
      - name: Fingerprint the analysis
        shell: bash
        run: |
          "${{ matrix.binary }}" analyze Tests/Fixtures/python-package \
            --out fixture.json --no-drift
          "${{ matrix.binary }}" analyze . --out repository.json --no-drift
          python - <<'PY'
          import hashlib, json
          # encoding is explicit: Python's text mode defaults to the locale
          # encoding, which on a Windows runner is cp1252. The report carries
          # typographic punctuation -- an em dash in kindExplanation -- and
          # reading those three UTF-8 bytes as three cp1252 characters changed
          # the digest without changing the analysis.
          digests = []
          for name in ("fixture.json", "repository.json"):
              report = json.load(open(name, encoding="utf-8"))
              report["project"].pop("parseSeconds")
              report["project"].pop("analysedAt")
              report["project"].pop("root")      # absolute, differs per runner
              report["project"].pop("name")      # the checkout's folder name
              digests.append(hashlib.sha256(
                  json.dumps(report, sort_keys=True).encode()).hexdigest())
              print(f"{name}: {report['project']['fileCount']} files, {digests[-1][:16]}")
          # newline="" keeps Python's text mode from turning this "\n" into
          # "\r\n" on Windows, which would make the file differ from the
          # others by an invisible byte and fail the comparison below.
          with open("fingerprint.txt", "w", newline="") as handle:
              handle.write(" ".join(digests) + "\n")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: fingerprint-${{ matrix.name }}
          # The report travels with the fingerprint, so a disagreement can be
          # diffed rather than only detected.
          path: |
            fingerprint.txt
            fixture.json
            repository.json

      # Only Windows can produce a complete package: the engine is Swift and
      # does not cross-compile there from anywhere else.
      - name: Set up .NET
        if: runner.os == 'Windows'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Package
        if: runner.os == 'Windows'
        shell: bash
        run: bash Scripts/package-windows.sh dist/Atlas-windows-x64

      # The package is only worth shipping if it runs. This starts the actual
      # published, trimmed, single-file exe and has it draw a screen -- which
      # exercises the whole stack at once: the trimmer kept what the UI needs,
      # the source-generated JSON readers survived, the client found the engine
      # beside it, and Skia can put pixels on a surface.
      # A relative path and an absolute one must name the same project. They
      # did not: the packaged app drew ten files where the engine had just
      # found seventy-three, and the only difference was how the path reached
      # it. Cheap to assert, and it would have caught that before it shipped.
      # The packaged app drew ten files where the engine, on the same runner
      # and the same checkout, had just found seventy-three. Print what each
      # copy of the engine actually walked, so the difference is visible rather
      # than inferred.
      # The packaged app drew ten files where the engine, on the same runner
      # and the same checkout, had just found seventy-three -- and the missing
      # ones were whole directories, not a scattering. Pointing the engine at
      # each of them separately says whether the walk is broken or whether
      # something above is pruning it.
      - name: What the engine walked
        if: runner.os == 'Windows'
        shell: bash
        run: |
          walk() { python Scripts/engine-walk.py .build/release/atlas-engine.exe "$1"; }
          echo "-- the whole repository --"; walk .
          echo "-- Sources on its own --";    walk Sources
          echo "-- Scripts on its own --";    walk Scripts
          echo "-- the client's Engine/ --";  walk Windows/Atlas.Windows/Engine
          echo "-- the client's Views/ --";   walk Windows/Atlas.Windows/Views
          echo "-- what is actually there --"
          find . -name '*.swift' -not -path './.build/*' | wc -l | xargs echo "     .swift on disk:"
          find . -name '*.cs' -not -path '*/obj/*' -not -path '*/bin/*' | wc -l | xargs echo "     .cs on disk:"

      - name: Draw a screen with it
        if: runner.os == 'Windows'
        shell: bash
        run: |
          ./dist/Atlas-windows-x64/Atlas.exe \
            --shot windows-map.png --project . --screen map --select 26
          test -s windows-map.png || { echo "::error::the app wrote no image"; exit 1; }
          echo "rendered $(wc -c < windows-map.png) bytes"

      - name: Upload what it drew
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-screenshot
          path: windows-map.png

      - name: Upload the package
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Atlas-windows-x64
          path: dist/Atlas-windows-x64

  # The macOS app must build where Apple's on-device model does not exist —
  # which is most machines, and every CI runner older than macos-15. It did
  # not: classifyProject sat inside a canImport(FoundationModels) region while
  # AppState called it unconditionally, so the app compiled only where the
  # model happened to be present and the release workflow had never once
  # succeeded. Nothing checked it, so nothing caught it.
  app:
    name: macOS app without the model
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Report toolchain
        run: swift --version
      - name: Build the app
        run: |
          chmod +x Scripts/*.sh
          ./Scripts/build.sh

  agree:
    name: Platforms agree
    needs: engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: fingerprint-*
      - name: Compare
        run: |
          # tr -d '\r' so a stray carriage return cannot masquerade as a
          # different analysis.
          found=$(find . -name fingerprint.txt | sort)
          echo "$found" | while read -r f; do
            printf '%-28s %s\n' "$(basename "$(dirname "$f")")" "$(tr -d '\r' < "$f")"
          done
          if [ "$(cat $found | tr -d '\r' | sort -u | wc -l)" -ne 1 ]; then
            echo "::error::the platforms produced different analyses of the same files"
            exit 1
          fi
          echo "all platforms produced the same analysis"
