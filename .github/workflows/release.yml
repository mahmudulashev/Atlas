name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0)'
        required: false
        default: '1.0'

permissions:
  contents: write

jobs:
  windows:
    name: Windows package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: SwiftyLab/setup-swift@latest
        with:
          swift-version: '6.3.3'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Determine version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.version }}" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> "$GITHUB_ENV"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=1.0" >> "$GITHUB_ENV"
          fi

      - name: Package
        shell: bash
        run: bash Scripts/package-windows.sh "dist/Atlas-$VERSION-windows-x64"

      # A package that builds is not a package that runs. Start it and have it
      # draw a screen before anyone is offered the download.
      - name: Prove it runs
        shell: bash
        run: |
          "./dist/Atlas-$VERSION-windows-x64/Atlas.exe" \
            --shot proof.png --project . --screen map
          test -s proof.png || { echo "::error::the packaged app drew nothing"; exit 1; }

      - name: Zip
        shell: bash
        run: |
          cd dist && 7z a "Atlas-$VERSION-windows-x64.zip" "Atlas-$VERSION-windows-x64" >/dev/null
          sha256sum "Atlas-$VERSION-windows-x64.zip" > "Atlas-$VERSION-windows-x64.zip.sha256"

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            dist/Atlas-${{ env.VERSION }}-windows-x64.zip
            dist/Atlas-${{ env.VERSION }}-windows-x64.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: Atlas-windows-x64
          path: dist/Atlas-${{ env.VERSION }}-windows-x64.zip

  build-and-release:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine Version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="1.0"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build DMG Package
        run: |
          chmod +x Scripts/*.sh
          export VERSION="${{ env.VERSION }}"
          ./Scripts/make-dmg.sh

      - name: Generate Checksums
        run: |
          cd "$GITHUB_WORKSPACE"
          DMG_FILE="Atlas-${{ env.VERSION }}.dmg"
          if [ ! -f "$DMG_FILE" ]; then
            DMG_FILE=$(ls Atlas-*.dmg | head -n 1)
          fi
          shasum -a 256 "$DMG_FILE" > "${DMG_FILE}.sha256"
          echo "SHA256 Checksum:"
          cat "${DMG_FILE}.sha256"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Atlas v${{ env.VERSION }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            Atlas-*.dmg
            Atlas-*.dmg.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
